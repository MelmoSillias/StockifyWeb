doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            IdentityAccess:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/IdentityAccess/Domain/Entity'
                prefix: 'App\IdentityAccess\Domain\Entity'
                alias: IdentityAccess
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Domain/Entity'
                prefix: 'App\Catalog\Domain\Entity'
                alias: Catalog
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Domain/Entity'
                prefix: 'App\Inventory\Domain\Entity'
                alias: Inventory
            Client:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Client/Domain/Entity'
                prefix: 'App\Client\Domain\Entity'
                alias: Client
            Commerce:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Commerce/Domain/Entity'
                prefix: 'App\Commerce\Domain\Entity'
                alias: Commerce
            Facturation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Facturation/Domain/Entity'
                prefix: 'App\Facturation\Domain\Entity'
                alias: Facturation
            Paiement:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Paiement/Domain/Entity'
                prefix: 'App\Paiement\Domain\Entity'
                alias: Paiement
            Livraison:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Livraison/Domain/Entity'
                prefix: 'App\Livraison\Domain\Entity'
                alias: Livraison
            Finance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Finance/Domain/Entity'
                prefix: 'App\Finance\Domain\Entity'
                alias: Finance
            Fournisseur:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Fournisseur/Domain/Entity'
                prefix: 'App\Fournisseur\Domain\Entity'
                alias: Fournisseur
            AccessAudit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/AccessAudit/Domain/Entity'
                prefix: 'App\AccessAudit\Domain\Entity'
                alias: AccessAudit
            Impression:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Impression/Domain/Entity'
                prefix: 'App\Impression\Domain\Entity'
                alias: Impression
            Shop:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shop/Domain/Entity'
                prefix: 'App\Shop\Domain\Entity'
                alias: Shop
            Integration:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Integration/Domain/Entity'
                prefix: 'App\Integration\Domain\Entity'
                alias: Integration
        filters:
            shop_scope:
                class: App\SharedKernel\Infrastructure\Doctrine\Filter\ShopScopeFilter
                enabled: false
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
